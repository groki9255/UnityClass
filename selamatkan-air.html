<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Selamatkan Air</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#dff4ff;--ink:#0b3d5c;--card:#fff;--line:#b9e0f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e2a3a;--ink:#eaf6ff;--card:#17405a;--line:#2d6a8c}}
:root[data-theme="dark"]{--bg:#0e2a3a;--ink:#eaf6ff;--card:#17405a;--line:#2d6a8c}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
input{-webkit-user-select:text;user-select:text}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.side{position:fixed;top:0;bottom:0;display:none}
.zone{position:absolute;inset:0}
.hud{position:absolute;top:8px;left:8px;background:#0b3d5ccc;color:#fff;padding:4px 12px;border-radius:14px;font-weight:700;font-size:14px;pointer-events:none}
.zb{position:absolute;right:16px;bottom:104px;border:0;border-radius:20px;padding:8px 12px;font-size:15px;font-weight:700;background:#fffd;color:#0b3d5c}
.zb.jb{right:18px;bottom:24px;width:68px;height:68px;border-radius:50%;padding:0;font-size:32px;background:#fff;opacity:.4}
.ui{position:absolute;left:12px;bottom:20px;display:none;gap:8px}
.eb{width:44px;height:44px;border:0;border-radius:50%;background:#fffd;font-size:22px;padding:0;color:#0b3d5c;box-shadow:0 2px 6px #0004}
.ep{position:absolute;left:12px;bottom:76px;display:none;grid-template-columns:repeat(5,44px);gap:4px;background:#ffffffee;padding:6px;border-radius:16px;box-shadow:0 3px 10px #0004}
.ep .eb{background:#0b3d5c14;box-shadow:none}
.tp{position:absolute;left:12px;bottom:76px;display:none;gap:6px;background:#ffffffee;padding:6px;border-radius:16px;align-items:center;box-shadow:0 3px 10px #0004}
.tp input{width:170px;font-size:16px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;color:#0b3d5c;box-sizing:border-box}
#dv{position:fixed;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;display:none}
#obj{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#ff8a3d;color:#fff;font-weight:800;padding:6px 16px;border-radius:18px;font-size:clamp(13px,1.8vw,20px);text-align:center;max-width:60vw;pointer-events:none;display:none;z-index:5}
#mm{position:fixed;top:56px;left:50%;margin-left:-60px;width:120px;height:120px;border-radius:12px;border:3px solid #fff;opacity:.92;pointer-events:none;display:none;z-index:5}
#toast{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%) scale(0);background:#fff;color:#0b3d5c;border:4px solid #ff8a3d;border-radius:36px;padding:16px 28px;font-size:clamp(18px,3.2vw,36px);font-weight:800;text-align:center;box-shadow:0 8px 24px #0005;transition:transform .35s cubic-bezier(.2,1.6,.4,1);pointer-events:none;max-width:80vw;z-index:20}
#toast.on{transform:translate(-50%,-50%) scale(1)}
#end{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:none;z-index:20}
#end .big{padding:6px 16px;font-size:14px;opacity:.85;box-shadow:0 3px 0 #c4621f}
button{font-family:inherit;cursor:pointer}
.big{border:0;border-radius:30px;padding:14px 34px;font-size:22px;font-weight:800;background:#ff8a3d;color:#fff;box-shadow:0 4px 0 #c4621f}
#menu{position:fixed;inset:0;overflow:auto;background:linear-gradient(var(--bg),var(--line));z-index:30;padding:10px 14px 24px;text-align:center;touch-action:pan-y;box-sizing:border-box}
#menu h1{margin:6px 0 0;font-size:30px}#menu p{margin:2px 0 8px}
.cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.card{background:var(--card);border-radius:18px;padding:10px 14px;width:310px;text-align:left;box-shadow:0 3px 10px #0003}
.card h3{margin:0 0 4px;text-align:center}.pv{width:150px;height:170px;display:block;margin:0 auto}
.card input{width:100%;box-sizing:border-box;padding:7px 10px;font-size:16px;border-radius:10px;border:2px solid var(--line);background:transparent;color:inherit;margin-bottom:4px}
.card.set{width:340px;margin:8px auto}
.card.set input[type=range]{flex:1;min-width:110px;width:auto;padding:0;margin:0}
.card.set input[type=number]{width:62px;margin:0;padding:5px 6px}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:5px 0}.row b{width:76px;font-size:13px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent;padding:0}
.ch{border:2px solid var(--line);background:transparent;color:inherit;border-radius:14px;padding:4px 9px;font-size:13px}
.on{outline:3px solid #ff8a3d;outline-offset:1px}
.hint{font-size:13px;opacity:.85;max-width:560px;margin:4px auto}
#rot{display:none;position:fixed;inset:0;background:#0b3d5c;color:#fff;z-index:99;align-items:center;justify-content:center;font-size:24px;text-align:center;padding:20px}
body.rot #menu{touch-action:none}
#bk{position:fixed;top:8px;right:54px;z-index:25;width:38px;height:38px;border:0;border-radius:50%;background:#fffd;font-size:19px;padding:0;display:none;box-shadow:0 2px 6px #0004}
#cf{position:fixed;inset:0;z-index:70;background:#0b3d5c99;display:none;align-items:center;justify-content:center}
#cf .bx{background:#fff;color:#0b3d5c;border:4px solid #ff8a3d;border-radius:24px;padding:16px 22px;text-align:center;max-width:80%;box-shadow:0 8px 24px #0006}
#cf p{margin:0 0 12px;font-weight:800;font-size:clamp(15px,2.6vw,22px)}
#cf button{margin:0 6px;border:0;border-radius:24px;padding:9px 28px;font-size:18px;font-weight:800;color:#fff}
#cfy{background:#ff8a3d;box-shadow:0 3px 0 #c4621f}#cfn{background:#3b82f6;box-shadow:0 3px 0 #2358b3}
body.sp #menu{visibility:hidden}
#sp{position:fixed;inset:0;z-index:60;background:#4aa6ee;opacity:0;transition:opacity 1.4s ease;touch-action:none;cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent}
#sp.on{opacity:1}#sp.out{opacity:0;transition:opacity .7s ease;pointer-events:none}
#spbg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(20px) brightness(.92)}
#spb{position:absolute}#spi{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
#spm{position:absolute;left:37.4%;top:75.4%;width:27.8%;height:17.2%;border-radius:999px;pointer-events:none;animation:spp 1.6s ease-in-out infinite}
@keyframes spp{0%,100%{box-shadow:0 0 0 0 #fff0,0 0 0 0 #ffd93d00;transform:scale(1)}50%{box-shadow:0 0 26px 8px #fff9,0 0 0 3px #ffd93daa;transform:scale(1.04)}}
#spv{position:absolute;left:91.8%;top:2.6%;width:7.6%;height:13.4%;border-radius:50%;cursor:pointer}
#spv i{display:none;position:absolute;inset:8%;border-radius:50%;background:linear-gradient(to top right,transparent 45%,#ff3b3b 45%,#ff3b3b 55%,transparent 55%)}
#spv.mut i{display:block}
#bgmb{position:fixed;top:8px;right:8px;z-index:25;width:38px;height:38px;border:0;border-radius:50%;background:#fffd;font-size:19px;padding:0;display:none;box-shadow:0 2px 6px #0004}
.dlg{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:min(96%,440px);display:none;z-index:8;background:var(--card);color:var(--ink);border:3px solid #ff8a3d;border-radius:18px;padding:6px 10px 8px;box-shadow:0 6px 18px #0006;font-size:13px;box-sizing:border-box;overflow:hidden}
.dh{display:flex;justify-content:space-between;align-items:center;font-size:14px}.dh .x{border:0;border-radius:50%;width:26px;height:26px;padding:0;background:#ff5a5a;color:#fff}
.dq{font-size:11px;opacity:.7;font-style:italic;margin:2px 0}.dt{margin:4px 0;line-height:1.35;max-height:140px;overflow:hidden}
.dop{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}.ob{border:2px solid #ff8a3d;background:transparent;color:inherit;border-radius:14px;padding:5px 10px;font-size:13px;font-weight:700}
.de{display:none;grid-template-columns:repeat(10,1fr);gap:2px;margin:4px 0}.de button{border:0;background:#0b3d5c14;border-radius:8px;font-size:17px;padding:2px 0}
.dr{display:flex;gap:4px;margin:4px 0;align-items:center}.dr input{flex:1;min-width:0;font-size:16px;padding:5px 8px;border-radius:10px;border:2px solid var(--line);background:#fff;color:#0b3d5c;box-sizing:border-box}
.db{width:34px;height:34px;border:0;border-radius:50%;background:#0b3d5c14;font-size:18px;padding:0;flex:none}
</style></head><body class="sp">

let lsOK=false;
function forceLS(){

function bubTex(txt,em){
 const c=document.createElement('canvas'),x=c.getContext('2d');let sw,sh;
 if(em){c.width=c.height=256;sw=sh=2.6;x.fillStyle='#fff';x.strokeStyle='#ff8a3d';x.lineWidth=7;
  x.beginPath();x.moveTo(104,190);x.lineTo(128,248);x.lineTo(152,190);x.closePath();x.fill();x.stroke();
  x.beginPath();x.roundRect(28,10,200,190,48);x.fill();x.stroke();
  x.font='120px serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#000';x.fillText(txt,128,108)}
 else{const W=512,H=190;c.width=W;c.height=H;
  let L=[txt];if(txt.length>16){const m=txt.length>>1;let b=-1;for(let i=0;i<txt.length;i++)if(txt[i]==' '&&(b<0||Math.abs(i-m)<Math.abs(b-m)))b=i;if(b<0)b=m;L=[txt.slice(0,b).trim(),txt.slice(b).trim()]}
  let f=42;x.font='bold '+f+'px sans-serif';
  while(f>20&&Math.max(...L.map(l=>x.measureText(l).width))>430){f-=2;x.font='bold '+f+'px sans-serif'}
  const tw=Math.max(...L.map(l=>x.measureText(l).width)),bw=Math.max(110,tw+56),bh=L.length*f*1.25+28,by=H-34-bh,bx=(W-bw)/2;
  x.fillStyle='#fff';x.strokeStyle='#ff8a3d';x.lineWidth=6;
  x.beginPath();x.moveTo(W/2-18,by+bh-6);x.lineTo(W/2,H-6);x.lineTo(W/2+18,by+bh-6);x.closePath();x.fill();x.stroke();
  x.beginPath();x.roundRect(bx,by,bw,bh,30);x.fill();x.stroke();
  x.fillStyle='#0b3d5c';x.textAlign='center';x.textBaseline='middle';
  L.forEach((l,i)=>x.fillText(l,W/2,by+14+f*1.25*(i+.5)));
  sw=7;sh=7*H/W}
 return{t:new T.CanvasTexture(c),sw,sh}}

['lelah',/capek|lelah|ngantuk|lemas|letih|mengantuk|istirahat/,'s',["Wah, kamu sudah bekerja keras. Istirahat sebentar, minum air putih, lalu lanjut lagi.","Capek itu tanda kamu sudah berusaha. Duduk dulu di bawah pohon, ya.","Tidur cukup itu penting supaya besok kuat belajar dan bermain. Jangan begadang ya, {n}."],['😴','🙂','😊']],
['lapar',/lapar|laper|makan|haus|jajan|minum|sarapan/,'n',["Kalau lapar, jangan lupa baca basmalah sebelum makan dan makan dengan tangan kanan.","Makan secukupnya ya, {n}. Dan pastikan bungkusnya masuk tempat sampah.","Minum air putih yang cukup bagus untuk badan. Jangan lupa membaca doa sebelum minum.","Jajan boleh, asal sehat dan bungkusnya tidak dibuang sembarangan."],['😋','😊','🙂']],
['bosan',/bosan|bosen|gabut|males|malas/,'n',["Bosan? Ayo cari sampah di halaman, itu seperti berburu harta karun!","Coba tanya Ustadz tebak-tebakan. Ketik 'tebak' dan kita main.","Kalau bosan, ajak temanmu menanam pohon. Seru dan banyak pahalanya."],['😄','🤔','🙂']],
['senang',/senang|seneng|bahagia|asyik|asik|gembira|seru|suka/,'p',["Alhamdulillah kamu senang. Bersyukur itu membuat nikmat bertambah.","Wah ikut bahagia, {n}! Bagikan kebahagiaanmu ke teman-temanmu ya.","Rasa senang paling indah itu ketika kita bisa membantu orang lain dan alam."],['😄','🥳','😊']],
['sayang',/sayang|cinta|love|peluk|rindu|kangen/,'p',["Masya Allah, terima kasih. Ustadz juga sayang pada semua murid, termasuk kamu.","Cintailah Allah, Rasul, orang tua, guru, dan alam sekitar kita ya, {n}.","Aamiin, semoga rasa sayangmu membawa kebaikan. Ayo wujudkan dengan menjaga lingkungan."],['🤗','❤️','😊']]
);

['sampah',/sampah|botol|plastik|bungkus|kotor|bersih|buang|\btong\b|limbah/,'n',["Sampah harus dibuang pada tempatnya. Pungut dulu, bawa ke tempat sampah, baru halaman kita bersih.","Kebersihan itu bagian dari iman. Kalau halaman bersih, hati pun terasa tenang.","Pilah sampah ya: sisa makanan, plastik, dan kertas sebaiknya dipisah supaya mudah didaur ulang.","Jangan buang sampah ke selokan atau sungai, nanti airnya tersumbat dan bisa banjir."],['🗑️','♻️','🙂']],
['air',/\bair\b|banjir|sungai|keran|wudhu|wudu|tirta|mata air/,'n',["Air itu nikmat dari Allah. Kita harus hemat dan menjaganya tetap bersih.","Tanpa air, tidak ada kehidupan. Itulah mengapa misi kita menyelamatkan air sangat penting.","Hemat air itu mudah: tutup keran saat tidak dipakai, dan gunakan air secukupnya.","Banjir sering terjadi karena sampah menyumbat aliran air dan pohon makin sedikit."],['💧','🌊','🙂']],
['hujan',/hujan|awan|mendung|cuaca|petir|panas|dingin|kemarau|musim/,'n',["Hujan itu rahmat dari Allah. Saat hujan turun, bacalah doa Allahumma shayyiban nafi'an.","Kalau banyak pohon dan tanah resapan, air hujan masuk ke tanah dan tidak menggenang.","Hujan turun dari awan hasil penguapan air. Itu namanya siklus air.","Cuaca panas atau hujan, tugas kita sama: menjaga bumi yang Allah titipkan."],['🌧️','☔','🙂']],
['pohon',/pohon|tanam|bibit|siram|hijau|hutan|tumbuh|daun|kebun|taman/,'n',["Menanam pohon itu amal baik. Selama pohon memberi manfaat, pahalanya terus mengalir.","Bibit kecil perlu disiram dan dirawat supaya tumbuh besar dan teduh.","Pohon menjaga tanah, menyimpan air, dan memberi udara segar. Hebat ya.","Satu pohon yang kamu tanam hari ini bisa menaungi banyak orang nanti."],['🌳','🌱','🙂']],
['sekolah',/sekolah|sdit|kelas|teman|pelajaran|upacara|banjarbaru|qardhan|murid|siswa/,'p',["SDIT Qardhan Hasana Banjarbaru adalah sekolah kita. Mari kita jaga kebersihan dan keindahannya.","Teman di sekolah itu seperti saudara. Saling membantu dan menghormati ya, {n}.","Sekolah yang bersih membuat belajar jadi nyaman. Itu salah satu tujuan misi kita.","Di sekolah kita belajar ilmu dan adab. Dua-duanya sama pentingnya."],['😊','🏫','🙂']],
['masjid',/masjid|mesjid|sholat|shalat|salat|adzan|azan|ngaji|quran|qur'an|puasa|kubah|imam/,'p',["Masjid adalah rumah Allah. Mari kita jaga kebersihannya dan jangan membuat gaduh.","Sholat tepat waktu itu kebiasaan baik. Ustadz doakan kamu rajin sholat, {n}.","Membaca Al-Qur'an sedikit-sedikit tiap hari lebih baik daripada banyak tapi jarang.","Sebelum masuk masjid, ingat berwudhu dan masuk dengan kaki kanan ya."],['🕌','🙏','😊']],
['doa',/\bdoa\b|do'a|berdoa|amin|aamiin|bismillah|alhamdulillah|insya ?allah|masya ?allah|subhanallah/,'p',["Aamiin ya Rabbal 'alamin. Semoga doamu dikabulkan Allah, {n}.","Mulailah segala sesuatu dengan bismillah, dan akhiri dengan alhamdulillah.","Berdoa itu kekuatan seorang muslim. Setelah berusaha, kita bertawakal pada Allah.","Masya Allah, senang mendengar kalimat thayyibah darimu, {n}."],['🙏','😊','🤲']],
['belajar',/belajar|\bpr\b|ujian|ulangan|nilai|baca|buku|rajin|pelajaran|sekolah online/,'p',["Belajar itu tidak hanya di kelas. Merawat tanaman dan memungut sampah juga belajar, lho.","Rajin membaca membuat kita pintar. Mulai dari satu halaman setiap hari, {n}.","Kalau ada pelajaran sulit, jangan malu bertanya pada guru atau teman.","Ilmu yang bermanfaat itu yang kita amalkan, misalnya menjaga lingkungan."],['📚','😊','👍']],
['main',/main|game|permainan|lompat|lari|petualang|jalan|zoom|kamera/,'p',["Bermain boleh, asal tetap sopan dan tahu waktu. Dalam game ini kamu bisa lompat dengan tombol 🦘.","Geser layar kiri untuk jalan, geser kanan untuk memutar kamera, dan ketuk layar untuk jalan ke titik.","Tombol 🔍 mengatur jarak kamera: dekat, sedang, atau jauh.","Main bersama teman lebih seru. Bagilah tugas, satu mengumpulkan sampah, satu lagi menanam."],['🎮','😄','🙂']],
['misi',/misi|bantu|tolong|tugas|apa yang harus|cara main|bagaimana cara|harus apa/,'n',["{misi}","Tentu Ustadz bantu. {misi}","Misi kita sederhana: bersihkan halaman, tanam pohon, siram, lalu hujan turun. {misi}"],['💪','🙂','👍']],
['semut',/semut|serangga|hewan|kucing|burung|ikan|binatang|lebah/,'n',["Semut mengajarkan kerja sama. Itulah mengapa misi pertama kita bernama Operasi Semut.","Hewan juga makhluk Allah. Kalau lingkungan bersih, mereka pun ikut sehat dan aman.","Burung dan serangga suka tinggal di tempat yang banyak pohon dan bersih."],['🐜','🐦','🙂']],
['keluarga',/rumah|keluarga|ayah|ibu|ortu|orang tua|abi|umi|adik|kakak|nenek|kakek/,'p',["Sayangi orang tuamu, {n}. Ridha Allah ada pada ridha orang tua.","Bagus kalau kamu ingat keluarga. Ajak mereka juga menjaga kebersihan rumah dan hemat air.","Salam untuk keluargamu di rumah ya, semoga mereka sehat selalu."],['🤗','😊','🙂']],
['robot',/robot|\bai\b|manusia|nyata|asli|komputer/,'n',["Ustadz Firman adalah karakter di dalam game ini yang menemani misi kalian. Senang menjadi temanmu!","Ustadz memang tokoh dalam permainan, tapi pesan-pesannya nyata: jaga air dan lingkungan.","Hehe, Ustadz tokoh game. Tapi menjaga bumi itu betul-betul tugas kita bersama."],['😄','🙂','🤔']],
['lelucon',/tebak|lelucon|lawak|\bjoke\b|bercanda|humor|cerita lucu|teka-teki|teka teki/,'p',["Siap!"],['🤔','😄','🙂']],
['bingung',/bingung|\bapa\b|kenapa|mengapa|bagaimana|gimana|siapa|dimana|di mana|kapan|\?/,'n',["Pertanyaan bagus. Ustadz coba jawab sebisa mungkin ya.","Rasa ingin tahu itu tanda orang cerdas. Teruslah bertanya.","Kalau Ustadz belum tahu jawabannya, kita cari tahu bersama."],['🤔','🙂','😊']],
['setuju',/\b(iya|ya|yap|betul|benar|setuju|oke|ok|siap|baik|yes|boleh|mau)\b/,'p',["Alhamdulillah, kita sepakat.","Baik, kita sepakat ya.","Siap, Ustadz senang kita sepaham."],['👍','😊','🙂']],
['tidak',/\b(tidak|nggak|ngga|ga|gak|enggak|belum|tak|no|jangan)\b/,'n',["Tidak apa-apa, kamu boleh berbeda pendapat dengan sopan.","Oh begitu. Kalau belum mau, tidak usah dipaksa.","Baik, Ustadz hargai pendapatmu."],['🙂','🤔','😊']]

['takut',/takut|seram|hantu|gelap|khawatir|was-was|ngeri/,'s',["Takut itu perasaan yang wajar, {n}. Orang pemberani pun kadang takut.","Kalau takut, ingat Allah selalu menjaga kita. Coba baca ayat kursi dan bismillah pelan-pelan.","Takut sering terasa lebih besar kalau dipendam sendiri. Menceritakannya sudah langkah yang berani.","Tarik napas dalam-dalam, hitung sampai lima, lalu hembuskan pelan. Itu bisa membantu tubuh jadi tenang."],['🤗','🙏','😊']],
['cemas',/cemas|gugup|deg-degan|grogi|nilai jelek|nilai rendah|remedial|gagal|nggak bisa|tidak bisa|susah banget|panik/,'s',["Merasa cemas sebelum hal penting itu normal. Itu tandanya kamu peduli.","Nilai bukan ukuran seluruh dirimu, {n}. Yang penting kamu mau berusaha dan terus belajar.","Coba pecah tugasnya jadi bagian kecil. Selesaikan satu per satu, pelan-pelan saja.","Kalau gagal, itu bukan akhir. Banyak orang hebat belajar dari kegagalan dulu baru berhasil."],['🤗','💪','😊']],
['malu',/malu|minder|tidak percaya diri|insecure|pede\b|grogi/,'s',["Rasa malu dialami banyak orang, bahkan orang dewasa. Kamu tidak sendirian.","Allah menciptakan setiap orang dengan kelebihannya masing-masing, termasuk kamu, {n}.","Mulai dari hal kecil: menyapa satu teman atau menjawab satu pertanyaan di kelas. Lama-lama makin berani.","Kamu tidak perlu sempurna untuk disukai. Menjadi dirimu sendiri sudah cukup."],['🤗','😊','👍']],
['temanribut',/berantem|bertengkar|ribut|musuhan|dijauhi|tidak punya teman|nggak punya teman|diejek|mengejek|diledek/,'s',["Bertengkar dengan teman memang bikin tidak enak. Rasulullah mengajarkan kita untuk saling memaafkan.","Kalau diejek, tidak apa-apa merasa sakit hati. Coba ceritakan pada guru atau orang tua supaya dibantu.","Pertemanan kadang naik turun. Coba bicara baik-baik saat kalian sama-sama tenang.","Kamu boleh minta maaf duluan, itu tanda hati yang besar, bukan tanda kalah."],['🤗','🙏','😊']],
['rindu',/rindu rumah|kangen (rumah|ayah|ibu|abi|umi|nenek|kakek|orang tua)|ingin pulang|pengen pulang|mau pulang/,'s',["Kangen keluarga itu tanda kamu sayang sekali pada mereka, {n}.","Waktu rindu, kirimkan doa untuk mereka. Doa sampai meski kita berjauhan.","Sebentar lagi waktunya pulang. Sambil menunggu, kita isi hari dengan kegiatan yang baik."],['🤗','🙏','😊']],
['dimarahi',/dimarahi|dimarahin|orang tua marah|ortu marah|dihukum|dimarahi guru|ditegur/,'s',["Dimarahi memang tidak enak. Biasanya orang tua atau guru menegur karena sayang dan ingin kita jadi lebih baik.","Coba pikirkan dulu apa yang membuat mereka menegur, lalu minta maaf dan perbaiki dengan baik.","Kalau terasa tidak adil, sampaikan perasaanmu dengan sopan saat suasana sudah tenang."],['🤗','🙏','🙂']],
['iri',/\biri\b|cemburu|temanku punya|aku tidak punya|nggak punya|ingin punya/,'s',["Merasa iri itu manusiawi, {n}. Yang penting jangan sampai membuat kita membenci.","Setiap orang punya rezeki dan kelebihan berbeda. Syukuri yang kamu punya, lalu berusahalah.","Kalau ada teman yang punya sesuatu, doakan kebaikan untuknya. Insya Allah kamu juga dapat rezeki."],['🤗','🙏','😊']],
