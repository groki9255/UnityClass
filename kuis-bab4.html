<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instrumen Penilaian Digital IPAS – SD-IT Qardhan Hasana Banjarbaru</title>
<style>
:root{--bg:#f1f7fa;--card:#fff;--tx:#14262e;--mu:#58707a;--pr:#1f77a8;--prt:#fff;--ln:#d2e1e8;--ok:#2e7d4f;--no:#c0392b;--wn:#e08a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a20;--card:#17262e;--tx:#e6f0f4;--mu:#9bb1ba;--pr:#5bb4e0;--prt:#0a1419;--ln:#2a3f4a;--ok:#56b87f;--no:#ff7a6b;--wn:#f0a93a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a20;--card:#17262e;--tx:#e6f0f4;--mu:#9bb1ba;--pr:#5bb4e0;--prt:#0a1419;--ln:#2a3f4a;--ok:#56b87f;--no:#ff7a6b;--wn:#f0a93a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:calc(16px*var(--fs,1.25))}
.fz{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:8px 16px;font:14px system-ui,sans-serif;color:var(--mu);background:var(--bg)}
.fz button{font-size:16px;font-weight:700;padding:6px 14px;min-width:52px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:min(100%,46rem);margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.4rem;margin:0 0 4px}h2{font-size:1.05rem;margin:0 0 8px}
.mu{color:var(--mu);font-size:.9rem}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:10px 16px}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number]{font:inherit;padding:9px 11px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--tx);width:100%}
.grid{display:grid;grid-template-columns:1fr 90px;gap:8px 12px;align-items:center;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.timer{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.3rem}
.timer.low{color:var(--no)}
.bar{height:8px;background:var(--ln);border-radius:5px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--pr);width:100%}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;margin:8px 0;cursor:pointer}
.opt.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 14%,transparent)}
.opt input{margin-top:5px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--ln);padding:8px;text-align:center}
td:first-child,th:first-child{text-align:left}
.stim{background:var(--bg);border-left:4px solid var(--pr);padding:10px 12px;border-radius:6px;margin:8px 0}
.tag{display:inline-block;font-size:.75rem;background:var(--pr);color:var(--prt);border-radius:20px;padding:2px 10px;margin-bottom:8px}
.big{font-size:3rem;font-weight:800;color:var(--pr);line-height:1.1}
.rv{border-top:1px solid var(--ln);padding:12px 0}
.ok-t{color:var(--ok);font-weight:600}.no-t{color:var(--no);font-weight:600}.wn-t{color:var(--wn);font-weight:600}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:14px}
textarea{font:inherit;width:100%;min-height:8rem;padding:9px 11px;margin-top:10px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--tx)}
.hide{display:none}
</style>
</head>
<body>
<div class="fz"><span>Ukuran huruf</span><button onclick="fs(-1)" aria-label="Perkecil huruf">A−</button><button onclick="fs(1)" aria-label="Perbesar huruf">A+</button></div>
<main id="app"></main>
<script>
var SEC=["Bagian A. Pilihan Ganda","Bagian B. Pilihan Ganda Kompleks","Bagian C. Benar–Salah / Kategori","Bagian D. Isian Singkat","Bagian E. Uraian (Essay)"];
var TF=["Benar","Salah"],CAT=["Penguapan","Kondensasi","Presipitasi"];
var BN=["A. Pentingnya Air dalam Kehidupan","B. Ketersediaan Energi Air","C. Pemanfaatan Air sebagai Sumber Energi","D. Dampak Kegiatan Manusia terhadap Sumber Energi Air"],G=BN,TY={s:"Pilihan ganda",m:"PG kompleks",tf:"Benar–Salah",cat:"Kategori",f:"Isian",e:"Uraian"},sel=[],shuf=false,cn=[],es={},SH=["PG","PG Kompleks","Benar–Salah / Kategori","Isian","Uraian"];for(var z=0;z<20;z++)cn.push(99);
// s=bagian, t=tipe (s,m,tf,cat,f), g=tujuan (indeks G), l=level kognitif
var ALL=[
{b:0,s:0,t:"s",g:0,l:"C1",q:"Jika dilihat dari luar angkasa, Bumi tampak berwarna biru. Hal ini terjadi karena ....",o:["sebagian besar Bumi tertutup hutan","lebih dari 70% permukaan Bumi ditutupi lautan","langit di Bumi selalu berwarna biru","air hanya ada di kutub Bumi"],a:1,e:"Lebih dari 70% permukaan Bumi ditutupi lautan, sehingga Bumi tampak biru."},
{b:0,s:0,t:"s",g:0,l:"C2",q:"Air sungai di atas tebing jatuh ke bawah dan membentuk air terjun. Peristiwa ini terjadi karena adanya ....",o:["gaya magnet","gaya gesek","gaya gravitasi","gaya dorong angin"],a:2,e:"Gaya tarik Bumi (gravitasi) membuat air selalu mengalir dari tempat tinggi ke tempat yang lebih rendah."},
{b:0,s:0,t:"s",g:0,l:"C3",q:"Di dekat sebuah hutan, ada sungai kecil yang tetap mengalir walaupun sudah berbulan-bulan tidak turun hujan. Penyebab yang paling mungkin adalah ....",o:["air laut naik ke sungai","awan selalu berhenti di atas sungai","air mengalir dari tempat rendah ke tempat tinggi","air tanah di akuifer mengalir perlahan ke sungai"],a:3,e:"Air tanah yang tersimpan di akuifer dapat mengalir perlahan ke sungai sehingga aliran air terjaga, terutama saat kemarau."},
{b:1,s:0,t:"s",g:1,l:"C3",q:"Perhatikan tahapan daur air berikut.",st:"(1) kondensasi  (2) evaporasi  (3) presipitasi  (4) air mengalir ke sungai dan laut",p:"Urutan tahapan daur air yang benar adalah ....",o:["(1) → (2) → (3) → (4)","(2) → (1) → (3) → (4)","(2) → (3) → (1) → (4)","(3) → (2) → (1) → (4)"],a:1,e:"Air menguap (evaporasi), uap menjadi awan (kondensasi), air jatuh sebagai hujan (presipitasi), lalu mengalir ke sungai dan laut."},
{b:1,s:0,t:"s",g:1,l:"C4",q:"Sebuah bendungan menggerakkan turbin untuk menghasilkan listrik. Saat kemarau panjang, listrik yang dihasilkan menurun. Penyebab utama penurunan tersebut adalah ....",o:["turbin rusak karena terlalu banyak air","air bendungan berpindah ke laut dalam sehari","hujan jarang turun sehingga air yang mengisi bendungan berkurang","uap air berhenti berubah menjadi awan selamanya"],a:2,e:"Daur air membuat hujan mengisi bendungan. Saat hujan jarang turun, air berkurang dan turbin kurang bertenaga."},
{b:0,s:1,t:"m",n:2,g:0,l:"C2",q:"Pilihlah 2 pernyataan yang benar tentang air di Bumi!",o:["Air di Bumi ada dalam bentuk cair, es, dan uap air.","Air hanya ditemukan di sungai dan danau.","Lebih dari 70% permukaan Bumi ditutupi air.","Air tanah hanya ada pada musim hujan.","Air selalu mengalir dari tempat rendah ke tempat tinggi."],a:[0,2],e:"Air ada sebagai cair, es di kutub, dan uap air, serta menutupi lebih dari 70% permukaan Bumi."},
{b:0,s:1,t:"m",n:3,g:0,l:"C2",q:"Pilihlah 3 contoh peran air bagi makhluk hidup!",o:["Tumbuhan menyerap air dari tanah untuk tumbuh.","Ikan hidup di dalam air sungai.","Petani mengairi sawah agar padi tumbuh.","Batu menyerap air agar dapat tumbuh besar.","Semua hewan darat bernapas dengan air."],a:[0,1,2],e:"Batu bukan makhluk hidup dan hewan darat tidak bernapas dengan air."},
{b:1,s:1,t:"m",n:3,g:1,l:"C2",q:"Pilihlah 3 pernyataan yang benar tentang tahapan daur air!",o:["Panas matahari membuat air di laut, danau, dan sungai menguap.","Uap air yang berubah menjadi butiran air membentuk awan.","Butiran air dari awan jatuh ke Bumi sebagai hujan, salju, atau gerimis.","Awan terbentuk dari asap pabrik.","Daur air berhenti ketika hujan turun."],a:[0,1,2],e:"Daur air berlangsung terus-menerus: penguapan, kondensasi, presipitasi, lalu aliran air."},
{b:1,s:1,t:"m",n:2,g:1,l:"C3",q:"Pilihlah 2 pernyataan yang benar tentang hubungan daur air dan energi air!",o:["Hujan mengisi sungai, waduk, dan bendungan yang dipakai untuk pembangkit listrik tenaga air.","Bendungan memanfaatkan aliran air untuk menggerakkan turbin.","Turbin pembangkit listrik tenaga air diputar oleh angin.","Ketersediaan air bendungan tidak dipengaruhi daur air.","Pembangkit listrik tenaga air dapat bekerja tanpa air."],a:[0,1],e:"Daur air menjaga ketersediaan air, dan aliran air itulah yang memutar turbin."},
{b:1,s:1,t:"m",n:3,g:1,l:"C1",q:"Pilihlah 3 contoh sumber daya air di Indonesia yang dimanfaatkan untuk menghasilkan energi listrik!",o:["Bendungan Jatiluhur di Jawa Barat","PLTA Sigura-gura di Sumatra Utara","Waduk Cirata di Jawa Barat","Candi Borobudur di Jawa Tengah","Kebun Raya Bogor di Jawa Barat"],a:[0,1,2],e:"Candi Borobudur dan Kebun Raya Bogor bukan sumber daya air untuk listrik."},
{b:0,s:2,t:"tf",g:0,l:"C2",q:"Sebuah foto menunjukkan Bumi dari luar angkasa dengan warna biru yang dominan. Tentukan pernyataan berikut Benar atau Salah!",r:["Warna biru muncul karena lebih dari 70% permukaan Bumi ditutupi lautan.","Air di Bumi hanya berbentuk cair.","Es di daerah kutub juga merupakan air.","Uap air di udara bukan termasuk air."],a:[0,1,0,1],e:"Air di Bumi dapat berbentuk cair, es, dan uap air."},
{b:1,s:2,t:"cat",c:CAT,g:1,l:"C2",q:"Tentukan tahapan daur air yang sesuai dengan setiap peristiwa berikut dengan memilih satu kolom yang tepat!",r:["Air sungai naik ke udara karena terkena panas matahari.","Uap air di udara berubah menjadi butiran air dan membentuk awan.","Butiran air di awan menjadi berat lalu jatuh sebagai hujan.","Air laut berkurang saat siang yang terik karena berubah menjadi uap air."],a:[0,1,2,0],e:"Penguapan: air menjadi uap. Kondensasi: uap menjadi awan. Presipitasi: air jatuh ke Bumi."},
{b:1,s:2,t:"tf",g:1,l:"C3",q:"Hujan lebat turun berhari-hari di pegunungan. Air hujan mengalir ke sungai dan mengisi bendungan. Air dari bendungan dialirkan untuk memutar turbin pembangkit listrik. Tentukan pernyataan berikut Benar atau Salah!",r:["Air hujan di pegunungan dapat mengisi sungai dan bendungan.","Turbin pembangkit listrik diputar oleh aliran air.","Pembangkit listrik tenaga air tetap bekerja walaupun tidak ada air.","Turunnya hujan merupakan tahap kondensasi."],a:[0,0,1,1],e:"Turunnya hujan adalah presipitasi. Tanpa air, turbin tidak berputar."},
{b:0,s:2,t:"tf",g:0,l:"C3",q:"Sebagian air hujan meresap ke dalam tanah dan melewati lapisan tanah, pasir, kerikil, hingga batuan. Tentukan pernyataan berikut Benar atau Salah!",r:["Akuifer adalah lapisan yang menyimpan air tanah dalam jumlah besar, seperti spons raksasa.","Semua lapisan tanah menyerap air dengan kemampuan yang sama.","Air tanah membantu menjaga kelembapan tanah yang dibutuhkan tumbuhan.","Air tanah dapat mengalir perlahan ke sungai sehingga aliran air terjaga saat kemarau."],a:[0,1,0,0],e:"Setiap lapisan memiliki kemampuan menyerap air yang berbeda-beda."},
{b:1,s:2,t:"tf",g:1,l:"C4",q:"Daur air diibaratkan sebagai mesin pengisi ulang air di Bumi yang bekerja terus-menerus. Tentukan pernyataan berikut Benar atau Salah!",r:["Daur air berlangsung berulang-ulang.","Daur air yang berjalan baik membantu menjaga ketersediaan air untuk pembangkit listrik.","Air yang menguap hilang dari Bumi selamanya.","Panas matahari berperan dalam proses penguapan."],a:[0,0,1,0],e:"Air yang menguap akan kembali ke Bumi sebagai hujan sehingga air tetap tersedia."},
{b:0,s:3,t:"f",g:0,l:"C1",q:"Air selalu mengalir dari tempat yang tinggi ke tempat yang lebih rendah karena adanya gaya ....",a:["gravitasi","gaya gravitasi"],d:"gravitasi",e:"Gaya tarik Bumi disebut gaya gravitasi."},
{b:0,s:3,t:"f",g:0,l:"C1",q:"Lapisan tanah yang mampu menyimpan air dalam jumlah besar disebut ....",a:["akuifer"],d:"akuifer",e:"Akuifer seperti spons raksasa yang menyimpan air tanah."},
{b:1,s:3,t:"f",g:1,l:"C1",q:"Proses berubahnya uap air di udara menjadi butiran-butiran air yang membentuk awan disebut ....",a:["kondensasi","pengembunan"],d:"kondensasi (pengembunan)",e:"Uap air mengembun menjadi butiran air dan membentuk awan."},
{b:1,s:3,t:"f",g:1,l:"C2",q:"Jatuhnya air dari awan ke permukaan Bumi dalam bentuk hujan, salju, atau gerimis disebut ....",a:["presipitasi"],d:"presipitasi",e:"Presipitasi adalah jatuhnya titik-titik air dari awan ke Bumi."},
{b:1,s:3,t:"f",g:1,l:"C2",q:"Bendungan memanfaatkan aliran air untuk menggerakkan .... yang menghasilkan listrik.",a:["turbin"],d:"turbin",e:"Aliran air memutar turbin pada pembangkit listrik tenaga air."},
{b:2,s:0,t:"s",g:0,l:"C1",q:"Listrik yang dihasilkan dari aliran air di sungai atau bendungan yang menggerakkan turbin disebut energi ....",o:["panas bumi","hidroelektrik","pasang surut","gelombang laut"],a:1,e:"Energi hidroelektrik adalah listrik dari aliran air yang menggerakkan turbin."},
{b:2,s:0,t:"s",g:0,l:"C2",q:"Energi pasang surut dihasilkan dari naik turunnya permukaan air laut yang dipengaruhi oleh ....",o:["gravitasi bulan","panas matahari","angin darat","arus sungai"],a:0,e:"Pasang surut terjadi karena pengaruh gravitasi bulan."},
{b:2,s:0,t:"s",g:0,l:"C3",q:"Sebuah daerah pantai memiliki ombak besar sepanjang tahun. Energi air yang paling cocok dikembangkan di sana adalah ....",o:["energi panas bumi","energi gelombang laut","energi hidroelektrik dari bendungan","energi dari uap gunung"],a:1,e:"Gerakan ombak dimanfaatkan untuk memutar mesin pembangkit listrik (energi gelombang laut)."},
{b:3,s:0,t:"s",g:1,l:"C2",q:"Pencemaran air oleh limbah pabrik berdampak pada pembangkit listrik tenaga air karena ....",o:["air menjadi lebih deras","kualitas air menurun dan dapat merusak mesin pembangkit","turbin berputar lebih cepat","air bendungan berubah menjadi uap"],a:1,e:"Air tercemar tidak layak digunakan dan dapat merusak mesin pembangkit."},
{b:3,s:0,t:"s",g:1,l:"C4",q:"Hutan di hulu sungai ditebang berlebihan. Saat musim hujan terjadi banjir, saat kemarau sungai mengering. Penyebab utamanya adalah ....",o:["pohon berkurang sehingga air hujan tidak tersimpan di dalam tanah","air laut naik sampai ke hulu sungai","matahari berhenti menguapkan air","turbin menghasilkan terlalu banyak listrik"],a:0,e:"Pohon menyerap dan menyimpan air hujan di dalam tanah. Tanpa pohon, air langsung mengalir ke sungai."},
{b:2,s:1,t:"m",n:2,g:0,l:"C2",q:"Pilihlah 2 pernyataan yang benar tentang energi air!",o:["Energi hidroelektrik memutar turbin dengan aliran air.","Energi gelombang laut memanfaatkan gerakan ombak.","Energi pasang surut berasal dari panas di dalam bumi.","Energi hidroelektrik dapat bekerja tanpa air.","Energi panas bumi memanfaatkan ombak laut."],a:[0,1],e:"Pasang surut dipengaruhi gravitasi bulan, sedangkan panas bumi berasal dari panas di dalam bumi."},
{b:2,s:1,t:"m",n:3,g:0,l:"C1",q:"Pilihlah 3 contoh pemanfaatan air sebagai sumber energi!",o:["Bendungan memutar turbin pembangkit listrik.","Ombak laut memutar mesin pembangkit listrik.","Uap air panas dari dalam bumi memutar turbin.","Air dipakai untuk mencuci piring.","Air dipakai untuk menyiram tanaman."],a:[0,1,2],e:"Mencuci piring dan menyiram tanaman adalah kegunaan air sehari-hari, bukan sumber energi."},
{b:3,s:1,t:"m",n:3,g:1,l:"C2",q:"Pilihlah 3 contoh dampak negatif kegiatan manusia terhadap sumber air!",o:["Membuang sampah ke sungai","Menebang hutan secara berlebihan","Membangun pabrik tanpa perencanaan di daerah aliran sungai","Menanam pohon di hulu sungai","Membuat sumur resapan"],a:[0,1,2],e:"Menanam pohon dan membuat sumur resapan membantu menjaga air."},
{b:3,s:1,t:"m",n:3,g:1,l:"C3",q:"Pilihlah 3 tindakan nyata untuk menjaga kelestarian air!",o:["Menutup keran setelah digunakan","Menggunakan air bekas cucian untuk menyiram tanaman","Menanam pohon di daerah resapan air","Membuang limbah ke sungai","Membiarkan keran menyala saat menyikat gigi"],a:[0,1,2],e:"Membuang limbah dan memboroskan air merusak kelestarian air."},
{b:3,s:1,t:"m",n:2,g:1,l:"C3",q:"Pilihlah 2 pernyataan yang benar tentang penggundulan hutan!",o:["Mengurangi kemampuan tanah menyimpan air hujan.","Dapat menyebabkan banjir saat musim hujan.","Membuat air hujan lebih banyak meresap.","Tidak memengaruhi siklus air.","Menambah daerah resapan air."],a:[0,1],e:"Penggundulan hutan mengganggu siklus air: banjir saat hujan dan kekeringan saat kemarau."},
{b:2,s:2,t:"cat",c:["Hidroelektrik","Gelombang laut","Pasang surut","Panas bumi"],g:0,l:"C2",q:"Tentukan jenis energi air yang sesuai dengan setiap uraian berikut dengan memilih satu kolom yang tepat!",r:["Listrik dari aliran air bendungan yang memutar turbin.","Pembangkit yang memanfaatkan gerakan ombak.","Tenaga dari naik turunnya air laut karena gravitasi bulan.","Uap dari air yang dipanaskan panas dalam bumi memutar turbin."],a:[0,1,2,3],e:"Setiap jenis energi memanfaatkan gerakan atau uap air dengan cara yang berbeda."},
{b:2,s:2,t:"tf",g:0,l:"C3",q:"Sebuah desa di dekat sungai yang deras membangun pembangkit listrik tenaga air berukuran kecil. Tentukan pernyataan berikut Benar atau Salah!",r:["Aliran sungai yang deras dapat memutar turbin.","Pembangkit tetap menghasilkan listrik walaupun sungai kering.","Listrik yang dihasilkan dapat dipakai untuk rumah dan sekolah.","Pembangkit ini memanfaatkan energi dari angin."],a:[0,1,0,1],e:"Pembangkit tenaga air membutuhkan aliran air untuk memutar turbin."},
{b:3,s:2,t:"cat",c:["Positif","Negatif"],g:1,l:"C2",q:"Tentukan dampak setiap kegiatan manusia berikut terhadap sumber air dengan memilih satu kolom yang tepat!",r:["Menanam pohon di hutan yang gundul.","Membuang limbah pabrik ke sungai.","Membuat sumur resapan di halaman rumah.","Membangun perumahan di daerah resapan air tanpa perencanaan."],a:[0,1,0,1],e:"Menanam pohon dan sumur resapan menjaga air. Limbah dan pembangunan tanpa perencanaan merusaknya."},
{b:3,s:2,t:"tf",g:1,l:"C3",q:"Sungai di dekat pemukiman penuh sampah dan limbah rumah tangga. Tentukan pernyataan berikut Benar atau Salah!",r:["Sampah dan limbah dapat menurunkan kualitas air.","Air yang tercemar tetap layak digunakan.","Pencemaran mengganggu makhluk hidup yang bergantung pada air.","Pencemaran dapat merusak mesin pembangkit listrik tenaga air."],a:[0,1,0,0],e:"Air tercemar tidak layak digunakan dan berbahaya bagi makhluk hidup serta mesin pembangkit."},
{b:3,s:2,t:"tf",g:1,l:"C4",q:"Sebuah daerah aliran sungai dipenuhi bangunan sehingga tanahnya tertutup beton. Tentukan pernyataan berikut Benar atau Salah!",r:["Daerah resapan air berkurang.","Air hujan lebih banyak meresap ke dalam tanah.","Risiko banjir meningkat.","Aliran air alami dapat terganggu."],a:[0,1,0,0],e:"Tanah yang tertutup beton sulit menyerap air, sehingga air hujan mengalir langsung dan memicu banjir."},
{b:2,s:3,t:"f",g:0,l:"C1",q:"Listrik dari aliran air yang menggerakkan turbin disebut energi ....",a:["hidroelektrik","hidro elektrik"],d:"hidroelektrik",e:"Energi hidroelektrik berasal dari aliran air di sungai atau bendungan."},
{b:2,s:3,t:"f",g:0,l:"C1",q:"Energi yang berasal dari panas di dalam bumi yang memanaskan air menjadi uap disebut energi ....",a:["panas bumi","geotermal"],d:"panas bumi (geotermal)",e:"Uap dari panas bumi dipakai untuk memutar turbin."},
{b:2,s:3,t:"f",g:0,l:"C2",q:"Naik turunnya permukaan air laut karena gravitasi bulan menghasilkan energi ....",a:["pasang surut"],d:"pasang surut",e:"Energi pasang surut berasal dari naik turunnya permukaan air laut."},
{b:3,s:3,t:"f",g:1,l:"C1",q:"Penebangan hutan secara berlebihan disebut ....",a:["penggundulan hutan","penggundulan"],d:"penggundulan hutan",e:"Penggundulan hutan mengurangi kemampuan tanah menyimpan air hujan."},
{b:3,s:3,t:"f",g:1,l:"C2",q:"Daerah tempat air hujan meresap ke dalam tanah disebut daerah ....",a:["resapan","resapan air"],d:"resapan (resapan air)",e:"Daerah resapan menyimpan air hujan di dalam tanah."},
{b:0,s:0,t:"s",l:"C3",k:"Pasar Terapung Lok Baintan di Sungai Martapura, Kabupaten Banjar, Kalimantan Selatan, ramai oleh pedagang yang berjualan di atas jukung (perahu kecil). Warga juga memakai sungai untuk bepergian dan kebutuhan sehari-hari.",q:"Jika sungai tersebut mengering, hal yang paling terganggu adalah ....",o:["jukung tidak dapat berlayar sehingga perdagangan dan transportasi terhambat","jumlah bintang di langit berkurang","batu di sungai tumbuh makin besar","angin berhenti bertiup"],a:0,e:"Air sungai dipakai manusia untuk transportasi, perdagangan, dan kebutuhan sehari-hari."},
{b:0,s:1,t:"m",n:2,l:"C3",k:"Pegunungan Meratus di Kalimantan Selatan memiliki hutan hujan yang menjadi hulu banyak sungai. Masyarakat di sekitar Loksado memanfaatkan air sungai untuk minum, mandi, dan mengairi ladang.",q:"Pilihlah 2 pernyataan yang benar berdasarkan teks!",o:["Air sungai dimanfaatkan manusia untuk kebutuhan sehari-hari.","Hutan di Pegunungan Meratus berperan sebagai hulu sungai.","Air sungai hanya dibutuhkan oleh hewan.","Tumbuhan di ladang tidak memerlukan air.","Air sungai di Meratus tidak dimanfaatkan siapa pun."],a:[0,1],e:"Teks menyebut sungai dipakai manusia dan hutan Meratus menjadi hulu sungai."},
{b:0,s:2,t:"tf",l:"C3",k:"Di Barito Kuala, Kalimantan Selatan, petani menanam padi di sawah pasang surut. Petani mengatur air sungai yang masuk ke sawah agar padi tumbuh.",q:"Tentukan pernyataan berikut Benar atau Salah!",r:["Padi membutuhkan air untuk tumbuh.","Petani mengatur air sawah karena air penting bagi tanaman.","Padi dapat tumbuh baik tanpa air sama sekali.","Air sungai tidak berperan bagi pertanian di daerah ini."],a:[0,0,1,1],e:"Tumbuhan, termasuk padi, membutuhkan air untuk tumbuh."},
{b:0,s:3,t:"f",l:"C1",k:"Banjarmasin, ibu kota Provinsi Kalimantan Selatan, dialiri banyak sungai seperti Sungai Barito dan Sungai Martapura.",q:"Kota di Kalimantan Selatan yang dijuluki Kota Seribu Sungai adalah ....",a:["banjarmasin"],d:"Banjarmasin",e:"Banjarmasin dijuluki Kota Seribu Sungai karena banyaknya sungai."},
{b:0,s:4,t:"e",l:"C4",k:"Banjarmasin dialiri banyak sungai, antara lain Sungai Barito dan Sungai Martapura. Warga memanfaatkan sungai untuk transportasi, perdagangan, dan kebutuhan sehari-hari.",q:"Jelaskan mengapa air sungai penting bagi makhluk hidup di daerah tersebut! Berikan minimal tiga contoh peran air.",d:"Poin: (1) manusia memakai air untuk minum, mandi, mencuci, transportasi, atau berdagang; (2) hewan, misalnya ikan, hidup di sungai; (3) tumbuhan/padi membutuhkan air untuk tumbuh; (4) tanpa air kehidupan terganggu. Skor 4: tiga contoh disertai alasan; 3: tiga contoh tanpa alasan; 2: dua contoh; 1: satu contoh; 0: tidak relevan.",e:"Air dibutuhkan manusia, hewan, dan tumbuhan."},
{b:1,s:0,t:"s",l:"C4",k:"Waduk Riam Kanan di Kabupaten Banjar, Kalimantan Selatan, menampung air untuk menggerakkan turbin PLTA Ir. P.M. Noor. Saat kemarau panjang, permukaan air waduk menurun.",q:"Penurunan permukaan air waduk saat kemarau panjang paling mungkin terjadi karena ....",o:["hujan jarang turun sehingga pasokan air ke waduk berkurang","turbin berhenti menguapkan air","uap air berubah menjadi batu","air waduk mengalir ke langit"],a:0,e:"Hujan (presipitasi) mengisi waduk. Saat hujan jarang, air berkurang."},
{b:1,s:1,t:"m",n:3,l:"C3",k:"Banjarmasin sering diguyur hujan deras pada musim hujan. Air hujan mengalir ke selokan dan sungai, sebagian meresap ke tanah, dan sebagian kembali menguap saat matahari terik.",q:"Pilihlah 3 pernyataan yang benar tentang daur air berdasarkan teks!",o:["Air hujan dapat mengalir ke sungai.","Sebagian air hujan meresap ke dalam tanah.","Panas matahari membuat air menguap kembali ke udara.","Air yang menguap hilang selamanya dari Bumi.","Hujan hanya turun di laut."],a:[0,1,2],e:"Daur air berlangsung terus-menerus; air yang menguap akan kembali sebagai hujan."},
{b:1,s:2,t:"tf",l:"C4",k:"Siswa di Banjarbaru membuat percobaan hujan dalam stoples. Mereka menuang air panas ke stoples, menutupnya dengan piring berisi es batu, lalu mengamati tetesan air di bawah piring.",q:"Tentukan pernyataan berikut Benar atau Salah!",r:["Air panas yang menguap menggambarkan tahap penguapan.","Es batu membuat uap air mengembun, menggambarkan kondensasi.","Tetesan air yang jatuh menggambarkan presipitasi.","Percobaan ini membuktikan air hilang selamanya setelah menguap."],a:[0,0,0,1],e:"Percobaan meniru penguapan, kondensasi, dan presipitasi; air tidak hilang."},
{b:1,s:3,t:"f",l:"C1",k:"PLTA Ir. P.M. Noor di Waduk Riam Kanan, Kalimantan Selatan, memanfaatkan air waduk yang terisi oleh air hujan.",q:"Tahap daur air ketika air jatuh dari awan sebagai hujan disebut ....",a:["presipitasi"],d:"presipitasi",e:"Jatuhnya air dari awan ke Bumi disebut presipitasi."},
{b:1,s:4,t:"e",l:"C4",k:"Waduk Riam Kanan di Kabupaten Banjar, Kalimantan Selatan, menyediakan air untuk PLTA. Saat hujan jarang turun, permukaan air waduk menurun.",q:"Jelaskan hubungan antara daur air dan ketersediaan air waduk untuk menghasilkan listrik! Urutkan tahapan daur airnya.",d:"Poin: urutan penguapan, kondensasi, presipitasi, lalu aliran air ke sungai dan waduk; hujan mengisi waduk; air waduk memutar turbin; saat hujan jarang air berkurang sehingga listrik menurun. Skor 4: urutan lengkap dan hubungan dengan waduk benar; 3: urutan lengkap, hubungan kurang jelas; 2: sebagian urutan; 1: satu tahap; 0: tidak relevan.",e:"Daur air menjaga ketersediaan air untuk pembangkit."},
{b:2,s:0,t:"s",l:"C3",k:"PLTA Ir. P.M. Noor memanfaatkan air Waduk Riam Kanan di Kabupaten Banjar. Air dari waduk dialirkan ke turbin, lalu turbin memutar generator sehingga menghasilkan listrik.",q:"Urutan kerja PLTA tersebut yang benar adalah ....",o:["air waduk → turbin berputar → generator → listrik","generator → listrik → turbin → air waduk","turbin → air waduk → listrik → generator","listrik → air waduk → generator → turbin"],a:0,e:"Aliran air memutar turbin, turbin memutar generator, lalu dihasilkan listrik."},
{b:2,s:1,t:"m",n:2,l:"C3",k:"Pesisir Kalimantan Selatan memiliki permukaan air laut yang naik dan turun setiap hari. Di daerah pegunungan, seperti Pegunungan Meratus, terdapat sungai berarus deras.",q:"Pilihlah 2 jenis energi air yang berpotensi dikembangkan berdasarkan teks!",o:["Energi pasang surut dari naik turunnya air laut","Energi hidroelektrik dari aliran sungai yang deras","Energi angin dari kincir di gurun","Energi panas bumi dari gunung es","Energi dari batu bara"],a:[0,1],e:"Naik turunnya air laut menghasilkan energi pasang surut; aliran deras menghasilkan energi hidroelektrik."},
{b:2,s:2,t:"cat",c:["Hidroelektrik","Gelombang laut","Pasang surut"],l:"C3",k:"Tim pengembang energi mempelajari tiga lokasi di Kalimantan Selatan: waduk di daerah pegunungan, pantai berombak, dan muara sungai yang dipengaruhi pasang surut.",q:"Tentukan jenis energi air yang paling cocok untuk setiap lokasi!",r:["Waduk di daerah pegunungan dengan aliran air yang deras.","Pantai dengan ombak besar sepanjang tahun.","Muara sungai yang air lautnya naik turun setiap hari."],a:[0,1,2],e:"Setiap jenis energi memanfaatkan gerakan air yang berbeda."},
{b:2,s:3,t:"f",l:"C2",k:"Di Kalimantan Selatan, PLTA Ir. P.M. Noor memutar turbin dengan air dari Waduk Riam Kanan.",q:"Bagian PLTA yang diputar oleh aliran air disebut ....",a:["turbin"],d:"turbin",e:"Aliran air memutar turbin."},
{b:2,s:4,t:"e",l:"C4",k:"Sebuah desa di kaki Pegunungan Meratus, Kalimantan Selatan, memiliki sungai berarus deras sepanjang tahun, tetapi belum teraliri listrik.",q:"Jelaskan bagaimana sungai tersebut dapat dimanfaatkan untuk menghasilkan listrik, dan sebutkan satu syarat agar listrik tetap tersedia!",d:"Poin: aliran air deras memutar turbin yang terhubung ke generator sehingga menghasilkan listrik (hidroelektrik); syarat: air harus tersedia sepanjang tahun, misalnya dengan menjaga hutan hulu, daur air, dan mencegah pencemaran. Skor 4: cara kerja dan syarat benar; 3: cara kerja benar, syarat kurang tepat; 2: hanya menyebut sungai memutar turbin; 1: jawaban sangat umum; 0: tidak relevan.",e:"Energi hidroelektrik bergantung pada aliran air."},
{b:3,s:0,t:"s",l:"C4",k:"Di Kalimantan Selatan, sebagian hutan di hulu sungai dibuka untuk lahan tambang dan perkebunan. Saat hujan lebat, air langsung mengalir ke sungai dan sering terjadi banjir; saat kemarau, sungai mudah mengering.",q:"Tindakan yang paling tepat untuk mengurangi masalah tersebut adalah ....",o:["menanam kembali pohon di daerah hulu dan menjaga daerah resapan","menutup seluruh sungai dengan beton","menebang lebih banyak pohon","membuang sampah ke sungai"],a:0,e:"Pohon menyerap dan menyimpan air hujan di dalam tanah."},
{b:3,s:1,t:"m",n:3,l:"C3",k:"Warga di tepi Sungai Martapura melihat sampah plastik dan limbah rumah tangga menumpuk di sungai. Air menjadi keruh dan berbau.",q:"Pilihlah 3 akibat yang mungkin terjadi!",o:["Kualitas air sungai menurun.","Ikan dan makhluk hidup lain terganggu.","Air sulit digunakan untuk kebutuhan sehari-hari.","Air menjadi lebih jernih dan segar.","Sungai bertambah dalam dengan sendirinya."],a:[0,1,2],e:"Pencemaran menurunkan kualitas air dan mengganggu makhluk hidup."},
{b:3,s:2,t:"cat",c:["Positif","Negatif"],l:"C3",k:"Warga di tepi sungai di Kalimantan Selatan melakukan berbagai kegiatan berikut.",q:"Tentukan dampak setiap kegiatan terhadap sumber air!",r:["Gotong royong membersihkan sampah di sungai.","Mencuci dan membuang limbah sembarangan ke sungai.","Menanam pohon di tepi sungai.","Membuka hutan di hulu tanpa menanam kembali."],a:[0,1,0,1],e:"Membersihkan sungai dan menanam pohon menjaga air; limbah dan pembukaan hutan merusaknya."},
{b:3,s:3,t:"f",l:"C2",k:"Banjir saat musim hujan dan kekeringan saat kemarau sering terjadi ketika hutan di hulu sungai gundul.",q:"Pohon berfungsi menyerap dan menyimpan air hujan di dalam ....",a:["tanah"],d:"tanah",e:"Pohon menyimpan air hujan di dalam tanah."},
{b:3,s:4,t:"e",l:"C4",k:"Di sebuah desa tepi sungai di Kalimantan Selatan, warga membuang sampah dan limbah rumah tangga ke sungai. Sementara itu, hutan di hulu sungai ditebang untuk membuka lahan.",q:"Jelaskan dua dampak negatif kegiatan tersebut terhadap sumber air, lalu tuliskan dua tindakan nyata yang dapat kamu lakukan untuk menjaga air!",d:"Dampak: pencemaran menurunkan kualitas air dan mengganggu makhluk hidup atau merusak mesin pembangkit; penebangan hutan menyebabkan banjir saat hujan dan kekeringan saat kemarau. Tindakan: tidak membuang sampah ke sungai, hemat air, menanam pohon, gotong royong membersihkan sungai, membuat sumur resapan. Skor maksimal 4: dua dampak (1 poin per dampak) dan dua tindakan (1 poin per tindakan).",e:"Kegiatan manusia memengaruhi sumber air dan siklus air."},
{b:0,s:0,t:"s",l:"C2",k:"Di Loksado, Kabupaten Hulu Sungai Selatan, wisatawan menikmati arung jeram bambu di sungai yang berair jernih.",q:"Kegiatan tersebut dapat dilakukan karena sungai ....",o:["memiliki aliran air yang cukup","tidak berisi air","berada di langit","seluruhnya terbuat dari bambu"],a:0,e:"Kegiatan di sungai membutuhkan air yang mengalir."},
{b:0,s:0,t:"s",l:"C3",k:"Sungai Barito adalah salah satu sungai besar di Kalimantan. Di sepanjang tepinya, warga menangkap ikan, kapal mengangkut barang, dan petani mengairi lahan.",q:"Pernyataan yang paling tepat tentang manfaat sungai tersebut adalah ....",o:["Air sungai bermanfaat bagi manusia, hewan, dan tumbuhan.","Air sungai hanya bermanfaat bagi ikan.","Air sungai tidak berhubungan dengan pertanian.","Air sungai hanya dipakai untuk kapal."],a:0,e:"Air sungai dimanfaatkan banyak makhluk hidup dan kegiatan manusia."},
{b:0,s:1,t:"m",n:3,l:"C3",k:"Di rawa-rawa Kalimantan Selatan hidup ikan seperti gabus dan papuyu, serta tumbuhan seperti eceng gondok dan purun.",q:"Pilihlah 3 pernyataan yang benar berdasarkan teks!",o:["Ikan hidup di perairan rawa.","Tumbuhan rawa memerlukan air untuk hidup.","Rawa merupakan salah satu sumber air.","Rawa selalu kering sepanjang tahun.","Ikan dapat hidup tanpa air."],a:[0,1,2],e:"Rawa tergenang air dan menjadi tempat hidup ikan dan tumbuhan."},
{b:0,s:2,t:"tf",l:"C3",k:"Seorang siswa di Banjarmasin mencatat: ibu memakai air untuk memasak, ayah menyiram kebun, dan burung minum di tepi sungai.",q:"Tentukan pernyataan berikut Benar atau Salah!",r:["Memasak adalah contoh penggunaan air oleh manusia.","Menyiram kebun membantu tumbuhan mendapat air.","Burung minum di sungai adalah contoh penggunaan air oleh hewan.","Hanya manusia yang membutuhkan air."],a:[0,0,0,1],e:"Manusia, hewan, dan tumbuhan sama-sama membutuhkan air."},
{b:0,s:3,t:"f",l:"C1",k:"Pedagang di Pasar Terapung Lok Baintan berjualan di atas perahu kecil di Sungai Martapura.",q:"Perahu kecil yang dipakai pedagang di pasar terapung Kalimantan Selatan disebut ....",a:["jukung"],d:"jukung",e:"Jukung adalah perahu kecil khas Banjar."},
{b:0,s:4,t:"e",l:"C3",k:"Pak Rahmat, petani di Kabupaten Banjar, mengairi sawahnya dari sungai. Saat kemarau, air sungai berkurang.",q:"Jelaskan mengapa air penting bagi padi, serta sebutkan dua cara agar air tetap tersedia!",d:"Poin: padi/tumbuhan membutuhkan air untuk tumbuh; sungai menjadi sumber air sawah. Cara: menjaga hutan dan menanam pohon, tidak mencemari sungai, hemat air, membuat penampung air. Skor 4: alasan dan dua cara; 3: alasan dan satu cara; 2: hanya alasan; 1: jawaban umum; 0: tidak relevan.",e:"Tumbuhan membutuhkan air untuk tumbuh."},
{b:1,s:0,t:"s",l:"C2",k:"Di Banjarbaru, matahari siang hari sangat terik. Air di genangan berkurang, dan sore hari awan gelap terbentuk.",q:"Berkurangnya air di genangan karena panas matahari disebut ....",o:["penguapan","kondensasi","presipitasi","aliran air"],a:0,e:"Air berubah menjadi uap karena panas matahari (penguapan)."},
{b:1,s:0,t:"s",l:"C3",k:"Pegunungan Meratus tinggi dan sering diselimuti awan. Uap air yang naik didinginkan udara pegunungan, lalu hujan turun dan mengalir ke sungai.",q:"Awan terbentuk karena uap air mengalami ....",o:["kondensasi","presipitasi","penguapan","aliran air"],a:0,e:"Uap air mengembun menjadi butiran air dan membentuk awan."},
{b:1,s:1,t:"m",n:2,l:"C3",k:"Saat musim hujan, Sungai Martapura airnya melimpah, sedangkan saat kemarau panjang debit airnya turun.",q:"Pilihlah 2 pernyataan yang benar!",o:["Hujan menambah air sungai.","Kemarau panjang dapat mengurangi air sungai.","Air sungai tidak dipengaruhi hujan.","Air sungai tidak pernah berubah.","Hujan hanya turun di laut."],a:[0,1],e:"Daur air memengaruhi banyaknya air sungai."},
{b:1,s:2,t:"cat",c:["Penguapan","Kondensasi","Presipitasi"],l:"C2",k:"Siswa di Banjarmasin mengamati kejadian berikut sepanjang hari.",q:"Tentukan tahapan daur air yang sesuai!",r:["Air Sungai Barito menjadi uap saat siang yang panas.","Uap air di udara membentuk awan gelap.","Hujan deras turun di atas kota."],a:[0,1,2],e:"Penguapan: air menjadi uap. Kondensasi: uap menjadi awan. Presipitasi: air jatuh ke Bumi."},
{b:1,s:3,t:"f",l:"C2",k:"Panas matahari membuat air sungai dan laut berubah menjadi uap air.",q:"Proses berubahnya air menjadi uap air karena panas matahari disebut ....",a:["penguapan","evaporasi"],d:"penguapan (evaporasi)",e:"Penguapan dipicu panas matahari."},
{b:1,s:4,t:"e",l:"C4",k:"Hujan lebat berhari-hari pernah membuat sungai meluap di sejumlah wilayah Kalimantan Selatan.",q:"Jelaskan tahap daur air yang terjadi saat hujan lebat turun dan ke mana saja air hujan itu mengalir!",d:"Poin: hujan lebat adalah presipitasi dari awan yang terbentuk lewat kondensasi uap air; air mengalir ke sungai, meresap ke tanah, atau menuju laut; jika tanah dan sungai tidak mampu menampung, air meluap. Skor 4: tahap dan aliran air lengkap; 3: sebagian lengkap; 2: hanya menyebut presipitasi; 1: jawaban umum; 0: tidak relevan.",e:"Air hujan mengalir ke sungai, meresap, atau kembali ke laut."},
{b:2,s:0,t:"s",l:"C1",k:"Pesisir Tanah Laut, Kalimantan Selatan, berhadapan dengan laut yang ombaknya bergerak terus-menerus.",q:"Energi yang memanfaatkan gerakan ombak di laut disebut energi ....",o:["gelombang laut","panas bumi","hidroelektrik","pasang surut"],a:0,e:"Energi gelombang laut berasal dari gerakan ombak."},
{b:2,s:0,t:"s",l:"C4",k:"Sebuah PLTA di Kalimantan Selatan menghasilkan listrik lebih besar saat musim hujan dan lebih kecil saat kemarau panjang.",q:"Kesimpulan yang tepat dari data tersebut adalah ....",o:["jumlah air yang mengalir memengaruhi listrik yang dihasilkan","listrik PLTA tidak bergantung pada air","kemarau membuat turbin berputar lebih cepat","hujan mengurangi listrik PLTA"],a:0,e:"Air yang cukup memutar turbin lebih kuat."},
{b:2,s:1,t:"m",n:3,l:"C2",k:"Listrik di rumah, sekolah, dan kantor di Kalimantan Selatan dapat berasal dari berbagai pembangkit, termasuk PLTA.",q:"Pilihlah 3 kegunaan listrik dari energi air!",o:["Menerangi rumah dan sekolah","Menjalankan alat elektronik","Menggerakkan mesin di pabrik","Menumbuhkan padi tanpa air","Menggantikan matahari"],a:[0,1,2],e:"Listrik dipakai untuk penerangan, alat, dan mesin."},
{b:2,s:2,t:"tf",l:"C3",k:"Siswa di Banjarbaru mempelajari bahwa panas bumi memanfaatkan uap dari air yang dipanaskan oleh panas di dalam bumi.",q:"Tentukan pernyataan berikut Benar atau Salah!",r:["Uap dapat memutar turbin pembangkit listrik.","Energi panas bumi berasal dari panas di dalam bumi.","Energi panas bumi berasal dari ombak laut.","Energi panas bumi tidak memerlukan air."],a:[0,0,1,1],e:"Panas bumi memanaskan air di bawah tanah menjadi uap yang memutar turbin."},
{b:2,s:3,t:"f",l:"C2",k:"Di PLTA, turbin yang berputar menggerakkan mesin lain untuk menghasilkan listrik.",q:"Mesin yang diputar turbin untuk menghasilkan listrik disebut ....",a:["generator"],d:"generator",e:"Turbin memutar generator sehingga dihasilkan listrik."},
{b:2,s:4,t:"e",l:"C3",k:"Banyak daerah di Kalimantan Selatan memiliki sungai, waduk, dan pesisir laut.",q:"Sebutkan dan jelaskan dua jenis energi air selain hidroelektrik beserta cara kerjanya!",d:"Poin: gelombang laut (gerakan ombak memutar mesin pembangkit); pasang surut (naik turun air laut karena gravitasi bulan); panas bumi (uap dari air yang dipanaskan panas bumi memutar turbin). Skor 4: dua jenis dan cara kerja benar; 3: dua jenis, satu cara benar; 2: dua jenis tanpa cara; 1: satu jenis; 0: tidak relevan.",e:"Ada beberapa jenis energi air selain hidroelektrik."},

 t.textContent=fmt(s);t.className="timer"+(s<=10?" low":"");document.getElementById("br").style.width=(r/(lim*10))+"%";
 if(r<=0&&!locked){locked=true;clearInterval(tm);t.textContent="Waktu habis!";
  document.querySelectorAll("input,textarea,#nx").forEach(function(e){e.disabled=true});setTimeout(next,1200)}}
function pick(k){var q=Q[i];if(q.t=="s")ans[i]=k;else{var a=ans[i],x=a.indexOf(k);x<0?a.push(k):a.splice(x,1)}
 document.querySelectorAll(".opt").forEach(function(l,n){var c=l.querySelector("input");l.classList.toggle("sel",c.checked)})}
function pickR(r,c){ans[i][r]=c}

function score(k){var q=Q[k],a=ans[k];if(q.t=="e")return es[k]||0;
 if(q.t=="s")return a===q.a?1:0;
 if(q.t=="m"){var ok=a.filter(function(x){return q.a.indexOf(x)>=0}).length,bad=a.length-ok;return Math.max(0,(ok-bad)/q.a.length)}
 if(q.t=="f"){var v=String(a).trim().toLowerCase().replace(/\s+/g," ");return q.a.indexOf(v)>=0?1:0}
 var m=0;q.a.forEach(function(x,n){if(a[n]===x)m++});return m/q.a.length}
function sum(){var n=Q.length,tot=0,gs=[0,0,0,0],gn=[0,0,0,0];Q.forEach(function(q,k){var s=score(k);tot+=s*100/n;gs[q.b]+=s;gn[q.b]++});tot=Math.round(tot*10)/10;var pe=Q.some(function(q){return q.t=="e"});
 return '<div class="card" style="text-align:center"><div class="mu">'+(name?esc(name)+" · ":"")+'Hasil Asesmen Formatif</div><div class="big">'+tot+'</div><div class="mu">dari 100 poin ('+n+' soal)'+(pe?' · skor uraian diisi guru di bawah':'')+'</div></div><div class="card"><h2>Ketercapaian per sub-bab</h2>'+G.map(function(g,b){if(!gn[b])return"";var p=Math.round(gs[b]/gn[b]*100);return '<div style="margin:8px 0"><div>Sub-bab '+esc(g)+': <b>'+p+'%</b> <span class="mu">('+(p>=75?"sudah paham":p>=50?"perlu penguatan":"perlu pengulangan")+')</span></div><div class="bar" style="margin:4px 0 0"><i style="width:'+p+'%"></i></div></div>'}).join("")+'</div>'}
function ess(k,v){es[k]=v/4;document.getElementById("sm").innerHTML=sum()}
function done(){var h='<div id="sm">'+sum()+'</div><div class="card"><h2>Pembahasan</h2>';
 Q.forEach(function(q,k){var s=score(k);
  if(q.t=="e"){h+='<div class="rv"><b>'+(k+1)+'. </b>'+esc(q.q)+'<div class="mu">Jawaban siswa:</div><div class="stim" style="white-space:pre-wrap">'+esc(ans[k]||"(tidak dijawab)")+'</div><div class="mu">Kunci/rubrik: '+key(q)+'</div><label class="mu">Skor dari guru (0–4): <select onchange="ess('+k+',this.value)">'+[0,1,2,3,4].map(function(v){return"<option>"+v+"</option>"}).join("")+'</select></label></div>';return}
  var c=s==1?"ok-t":s>0?"wn-t":"no-t",l=s==1?"Benar":s>0?"Sebagian benar ("+Math.round(s*100)+"%)":"Salah / tidak dijawab";
  h+='<div class="rv"><b>'+(k+1)+'. </b>'+esc(q.q)+'<div class="'+c+'">'+l+'</div><div class="mu">Kunci: '+key(q)+'</div><div class="mu">'+esc(q.e)+'</div></div>'});
 h+='</div><button class="p" style="width:100%" onclick="start()">Ulangi</button><button style="width:100%;margin-top:10px" onclick="keys()">Kunci Jawaban</button>';$(h)}
function ks(q){var L=function(n){return String.fromCharCode(65+n)};if(q.t=="e")return esc(q.d);
 if(q.t=="s")return L(q.a);
 if(q.t=="m")return q.a.map(L).join(", ");
 if(q.t=="f")return esc(q.d);
 var c=cats(q);return q.a.map(function(x){return c[x]}).join(", ")}
function keys(){clearInterval(tm);var L=pool(false),h='<div class="card"><div class="mu" style="font-weight:700">SD-IT QARDHAN HASANA BANJARBARU</div><h1>Kunci Jawaban dan Kisi-kisi</h1><div class="mu">Asesmen Formatif IPAS Kelas V · Bab 4 · '+L.length+' soal terpilih</div></div>',s=-1;
 L.forEach(function(q,k){if(q.s!=s){if(s>=0)h+='</table></div></div>';s=q.s;h+='<div class="card"><h2>'+SEC[s]+'</h2><div class="scroll"><table><tr><th style="width:3rem;text-align:center">No.</th><th>Kunci</th><th style="text-align:center">Level</th><th style="text-align:center">Sub-bab</th></tr>'}
  h+='<tr><td style="text-align:center"><b>'+(k+1)+'</b></td><td><b>'+ks(q)+'</b></td><td style="text-align:center">'+q.l+'</td><td style="text-align:center">'+"ABCD"[q.b]+'</td></tr>'});
 if(L.length)h+='</table></div></div>';
 h+='<div class="card"><h2>Keterangan sub-bab</h2><div class="mu">'+BN.map(function(n){return esc(n)}).join('<br>')+'</div></div><div class="mu" style="margin-bottom:10px">Soal Benar–Salah dan kategori: urutan jawaban dari pernyataan paling atas ke bawah. Skor tiap soal = 100 ÷ jumlah soal terpilih'+(L.length?' ('+(100/L.length).toFixed(1)+' poin per soal)':'')+'; soal pilihan ganda kompleks dan Benar–Salah/kategori dinilai sebagian.</div><button class="p" style="width:100%" onclick="start()">Kembali</button>';$(h)}
function key(q){var L=function(n){return String.fromCharCode(65+n)};if(q.t=="e")return esc(q.d);
 if(q.t=="s")return L(q.a)+". "+esc(q.o[q.a]);
 if(q.t=="m")return q.a.map(L).join(", ");
 if(q.t=="f")return esc(q.d);
 var c=cats(q);return q.r.map(function(r,n){return esc(r)+" = "+c[q.a[n]]}).join("; ")}
fs(0);start();
